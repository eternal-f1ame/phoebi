<!doctype html>
<html><head><meta charset="utf-8"><title>04-lco</title></head>
<body>
<script src="lib.js"></script>
<script src="combos.js"></script>
<script>
// The 40 combinations as columns (rows are species): they fill in, then leave-combinations-out
// lifts the nine held-out mixtures out in safranin while every species stays in training.
const W = 1728, H = 560;
const svg = setup(W, H, 13.2, 1);
const CELL = 27, STEP = 33, GAP = 42, TOP = 92;
const codes = SPECIES.map((s) => s.code);
const widthAll = COMBOS.length * STEP + 4 * GAP;
let x = (W - widthAll) / 2 + 30, prev = 0;
const cols = COMBOS.map(([code, held], i) => {
  const sp = code.split("_");
  if (prev && sp.length !== prev) x += GAP;
  prev = sp.length;
  const c = { code, held, sp, x, i };
  x += STEP;
  return c;
});

// group labels
const orders = [[1, "1 species"], [2, "2 species"], [3, "3 species"], [4, "4 species"], [6, "all 6"]];
const groupLabels = orders.map(([o, name]) => {
  const cs = cols.filter((c) => c.sp.length === o);
  const mid = (cs[0].x + cs[cs.length - 1].x + CELL) / 2;
  const g = el("g", {}, svg);
  txt(g, mid, 26, name, { size: 21, anchor: "middle", fill: C.ink2, weight: 600 });
  txt(g, mid, 50, `${cs.length}`, { size: 18, anchor: "middle", fill: C.muted });
  return { g, first: cs[0].i };
});

// row labels with a tick that appears last
const rowLabels = codes.map((s, r) => {
  const y = TOP + r * STEP + CELL / 2;
  const g = el("g", {}, svg);
  txt(g, cols[0].x - 16, y + 1, s, { size: 22, anchor: "end", baseline: "middle", mono: true, weight: 700, fill: C.ink });
  const tick = el("path", { d: `M${cols[0].x - 92} ${y} l7 7 l13 -14`, fill: "none", stroke: C.violet, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  return { g, tick };
});

// columns
for (const c of cols) {
  c.g = el("g", {}, svg);
  c.band = el("rect", { x: c.x - 3, y: TOP - 4, width: CELL + 6, height: codes.length * STEP + 2, rx: 5, fill: "none", stroke: C.safranin, "stroke-width": 2.5 }, c.g);
  c.cells = codes.map((s, r) => {
    const on = c.sp.includes(s);
    return { on, rect: el("rect", { x: c.x, y: TOP + r * STEP, width: CELL, height: CELL, rx: 4, fill: on ? C.violet : C.surface, stroke: on ? "none" : C.rule, "stroke-width": 1.5 }, c.g) };
  });
}

// switch
const sw = el("g", {}, svg);
const SWY = 350;
const swBg = el("rect", { x: W / 2 - 300, y: SWY - 26, width: 600, height: 52, rx: 26, fill: C.surface, stroke: C.rule, "stroke-width": 2 }, sw);
const knob = el("rect", { y: SWY - 21, width: 290, height: 42, rx: 21, fill: C.violet }, sw);
const swA = txt(sw, W / 2 - 150, SWY + 1, "Random split", { size: 22, anchor: "middle", baseline: "middle", weight: 600 });
const swB = txt(sw, W / 2 + 150, SWY + 1, "Leave-combinations-out", { size: 22, anchor: "middle", baseline: "middle", weight: 600 });

const cap1 = txt(svg, W / 2, 428, "", { size: 28, anchor: "middle", weight: 600, fill: C.ink });
const cap2 = txt(svg, W / 2, 464, "", { size: 22, anchor: "middle", fill: C.ink2 });

// the nine held-out mixtures, as chips
const held = cols.filter((c) => c.held);
const chips = [];
{
  const labels = held.map((c) => (c.sp.length === 6 ? "all six" : c.sp.join("+")));
  const widths = labels.map((l) => 22 + l.length * 13.6);
  const total = widths.reduce((a, b) => a + b, 0) + 14 * (labels.length - 1);
  let cx = (W - total) / 2;
  labels.forEach((l, i) => {
    const g = el("g", {}, svg);
    el("rect", { x: cx, y: 494, width: widths[i], height: 40, rx: 20, fill: C.safraninSoft, stroke: C.safranin, "stroke-width": 2 }, g);
    txt(g, cx + widths[i] / 2, 515, l, { size: 20, anchor: "middle", baseline: "middle", mono: true, weight: 700, fill: C.safranin });
    chips.push(g);
    cx += widths[i] + 14;
  });
}

function render(t) {
  // 1. columns fill in, left to right
  for (const c of cols) {
    const p = seg(t, 0.2 + c.i * 0.075, 0.65 + c.i * 0.075, ease.back);
    const lco = seg(t, 7.4 + held.indexOf(c) * 0.12, 8.2 + held.indexOf(c) * 0.12);
    const lift = c.held ? -16 * lco : 0;
    c.g.setAttribute("transform", `translate(${c.x + CELL / 2} ${TOP + 100 + lift}) scale(1 ${Math.max(0.001, p)}) translate(${-c.x - CELL / 2} ${-TOP - 100})`);
    show(c.g, c.held ? 1 : lerp(1, 0.55, seg(t, 7.4, 8.4)) * Math.min(1, p * 3));
    for (const cell of c.cells) if (cell.on) cell.rect.setAttribute("fill", c.held ? mix(C.violet, C.safranin, lco) : C.violet);
    show(c.band, c.held ? lco : 0);
  }
  for (const g of groupLabels) show(g.g, seg(t, 0.2 + g.first * 0.075, 0.8 + g.first * 0.075));
  for (const r of rowLabels) show(r.g, seg(t, 0, 0.6));

  // 2. captions and the switch
  const pSw = seg(t, 4.6, 5.2);
  show(sw, pSw);
  const toLco = seg(t, 7.0, 7.6);
  knob.setAttribute("x", lerp(W / 2 - 295, W / 2 + 5, toLco));
  swA.setAttribute("fill", mix(C.white, C.ink2, toLco));
  swB.setAttribute("fill", mix(C.ink2, C.white, toLco));

  if (t < 4.6) {
    cap1.textContent = "40 lab-made mixtures of 6 species";
    cap2.textContent = "every image is labelled with the species in its culture";
    show(cap1, seg(t, 3.4, 4.0)); show(cap2, seg(t, 3.6, 4.2));
  } else if (t < 7.0) {
    cap1.textContent = "Random split: every mixture is seen in training";
    cap2.textContent = "80 / 10 / 10 within each mixture — the in-distribution reference";
    show(cap1, seg(t, 4.8, 5.4)); show(cap2, seg(t, 5.0, 5.6));
  } else {
    cap1.textContent = "Leave-combinations-out: 9 whole mixtures are never seen";
    cap2.textContent = t < 10.6 ? "they are kept for the test" : "…and every species still appears in the 31 used for training";
    show(cap1, seg(t, 7.2, 7.8));
    show(cap2, t < 10.6 ? seg(t, 7.6, 8.2) * (1 - seg(t, 10.2, 10.6)) : seg(t, 10.7, 11.2));
  }
  chips.forEach((g, i) => {
    const p = seg(t, 8.6 + i * 0.12, 9.1 + i * 0.12, ease.back);
    show(g, Math.min(1, p * 2));
    g.setAttribute("transform", `translate(0 ${18 * (1 - p)})`);
  });
  rowLabels.forEach((r, i) => {
    const p = seg(t, 11.0 + i * 0.18, 11.4 + i * 0.18);
    r.tick.setAttribute("stroke-dasharray", "40");
    r.tick.setAttribute("stroke-dashoffset", 40 * (1 - p));
  });
}
window.render = render;
ready();
</script>
</body></html>
